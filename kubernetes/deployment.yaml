
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bta-app
  namespace: dev
  labels:
    app: bta-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: bta-app
  template:
    metadata:
      labels:
        app: bta-app
    spec:
      containers:
        - name: app
          image: bruno6725/linkpay:latest
          ports:
            - containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: bta-app-service
  namespace: dev
spec:
  type: NodePort
  selector:
    app: bta-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
